name: Format operator integration fixes
on:
  push:
    branches:
      - feat/operator-invites-console-frontend
    paths:
      - .github/workflows/format-operator-invites.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npx prettier --write src/components/peragus/automatic-purchase.tsx src/components/peragus/customer-onboarding.tsx src/components/peragus/customer-wallet-link.tsx
        working-directory: app/frontend
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/components/peragus/automatic-purchase.tsx app/frontend/src/components/peragus/customer-onboarding.tsx app/frontend/src/components/peragus/customer-wallet-link.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(frontend): format typed API responses"
            git push origin HEAD:feat/operator-invites-console-frontend
          fi
