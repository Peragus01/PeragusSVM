name: Format operator invitation files
on:
  push:
    branches:
      - feat/operator-invites-console-frontend
    paths:
      - .github/workflows/format-operator-invites.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - name: Format only operator files
        run: npx prettier --write src/routes/operador.convites.tsx src/routes/operador.estornos.tsx
        working-directory: app/frontend
      - name: Commit formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/routes/operador.convites.tsx app/frontend/src/routes/operador.estornos.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(operator): format invitation console with Prettier"
            git push origin HEAD:feat/operator-invites-console-frontend
          fi
