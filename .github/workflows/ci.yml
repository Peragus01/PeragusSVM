name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invitation_test
          POSTGRES_USER: invitation_test
          POSTGRES_PASSWORD: invitation_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U invitation_test -d invitation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_INVITE_DATABASE_URL: postgres://invitation_test:invitation_test@127.0.0.1:5432/invitation_test
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: node --check scripts/ozav-pix-expiry-demo.mjs
      - run: node --check scripts/settlement-audit-demo.mjs
      - run: node --check scripts/staging-e2e-smoke.mjs
      - run: node --check scripts/ozav-live-capabilities.mjs
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
