name: Format operator proxy fix
on:
  push:
    branches:
      - fix/operator-invite-proxy-staging
    paths:
      - .github/workflows/format-operator-proxy.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Run project Prettier on operator proxy changes
        working-directory: app/frontend
        run: npx prettier --write src/lib/peragus/journey-proxy.server.ts src/test/operator-invite-proxy.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/src/lib/peragus/journey-proxy.server.ts app/frontend/src/test/operator-invite-proxy.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(proxy): format operator invitation bridge"
            git push origin HEAD:fix/operator-invite-proxy-staging
          fi
