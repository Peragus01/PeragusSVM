<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peragus — Frontend Concepts</title><style>

er}.side-bottom{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:11px}.side-bottom b{font-size:12px}.side-bottom p{font-size:11px;line-height:1.6;color:var(--muted)}.side-bottom .mini{font-size:11px;color:var(--green)}.main{min-width:0}.top{height:74px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;gap:12px}.breadcrumb{font-size:12px;color:var(--muted)}.breadcrumb b{color:var(--ink);font-weight:650}.top-right{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:11px;color:var(--muted);font-weight:650}.avatar{height:32px;width:32px;background:#e9e9ff;color:#444c9c;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px}.theme{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px}.content{max-width:1400px;margin:auto;padding:36px 38px 70px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:27px}.eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.11em;text-transform:uppercase;margin-bottom:10px}h1{font-size:27px;letter-spacing:-.04em;margin:0 0 8px;font-weight:760}h2{font-size:15px;letter-spacing:-.015em;margin:0}p{margin:0}.subtitle{color:var(--muted);font-size:13px;line-height:1.6}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 13px;font-size:12px;font-weight:650;white-space:nowrap}.btn.primary{background:#3854da;border-color:#3854da;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.demo{background:var(--amberbg);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 20%,transparent);border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.5;margin-bottom:24px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);min-width:0}.metric{padding:20px}.metric-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}.metric strong{font-size:26px;letter-spacing:-.04em;display:block;margin-top:13px;font-variant-numeric:tabular-nums}.metric small{font-size:11px;color:var(--muted);display:block;margin-top:8px}.two{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,1fr);gap:18px;margin-bottom:20px}.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-body{padding:21px 22px}.muted{color:var(--muted)}.small{font-size:12px}.status{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:5px 8px;font-size:10px;font-weight:750;white-space:nowrap;background:var(--surface2);color:var(--muted)}.status.green{background:var(--greenbg);color:var(--green)}.status.amber{background:var(--amberbg);color:var(--amber)}.status.red{background:var(--redbg);color:var(--red)}.dot{width:6px;height:6px;background:currentColor;border-radius:50%}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.055em;text-transform:uppercase;font-weight:750;background:var(--surface2)}th,td{padding:14px 18px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}td b{font-weight:650}.row-list{display:grid}.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.circle{width:34px;height:34px;border-radius:9px;background:var(--accentbg);color:var(--accent);display:grid;place-items:center;flex-shrink:0}.item-main{flex:1;min-width:0}.item-main b{font-size:12px}.item-main p{font-size:11px;color:var(--muted);margin-top:4px}.right{text-align:right}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 14px;border-radius:8px;font-size:12px}.tabs button.active{background:var(--accentbg);border-color:var(--accentbg);color:var(--accent);font-weight:700}.filter{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{background:var(--surface2);border:1px solid var(--line);padding:10px 12px;border-radius:8px;color:var(--ink);min-width:180px;flex:1;font-size:12px}.select{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px;font-size:12px}.progress{height:7px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:13px 0}.progress>div{height:100%;background:#4b6bea;border-radius:6px}.steps{display:grid;gap:0}.step{display:flex;gap:12px;padding:12px 0}.step-dot{height:23px;width:23px;border-radius:50%;background:var(--accentbg);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0}.step b{font-size:12px}.step p{font-size:11px;color:var(--muted);margin-top:4px}.empty{padding:45px 20px;text-align:center;color:var(--muted);font-size:12px}.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.kv:last-child{border:0}.kv span{color:var(--muted)}.footer-note{font-size:11px;color:var(--muted);margin-top:22px;line-height:1.6}.toast{position:fixed;bottom:20px;right:20px;padding:13px 17px;background:var(--ink);color:var(--surface);border-radius:9px;box-shadow:0 6px 20px #0002;font-size:12px;z-index:5}.mobile-menu{display:none}.bar-chart{height:190px;display:flex;align-items:end;gap:10px;padding-top:20px}.barcol{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;height:100%}.bar{width:100%;max-width:50px;background:#a9b8ff;border-radius:5px 5px 0 0;min-height:2px}.bar.darkbar{background:#4b68e5}.barcol span{font-size:10px;color:var(--muted)}@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.content{padding:25px}.top{padding:0 25px}}@media(max-width:650px){.app{display:block}.sidebar{display:none;position:fixed;inset:0 auto 0 0;width:245px;z-index:10;box-shadow:0 0 0 100vmax #0008}.sidebar.open{display:flex}.mobile-menu{display:block;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 10px}.top{height:64px;padding:0 15px}.top-right .pill{display:none}.content{padding:24px 15px}.head{display:block}.actions{margin-top:17px}.metrics{gap:9px}.metric{padding:15px}.metric strong{font-size:21px}.panel-head,.panel-body{padding:16px}.eyebrow{font-size:10px}h1{font-size:23px}.toast{left:15px;right:15px}}
.hero-panel{padding:40px 38px;margin:18px 0 22px;border:1px solid #344363;border-radius:16px;background:radial-gradient(ellipse at 85% 20%,#213e66 0%,#141d30 55%,#111827 100%)}.hero-panel h2{font-size:clamp(32px,5vw,62px);line-height:1.07;letter-spacing:-.05em;margin:26px 0}.hero-panel em{color:#a6b8ff;font-style:normal}.hero-panel p{max-width:600px;line-height:1.8;color:var(--muted)}.kicker{letter-spacing:.15em;font-size:11px;color:#b5c3f4;font-weight:700}.hero-tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}.hero-tags span{border:1px solid #3a4761;border-radius:30px;padding:7px 12px;font-size:11px;color:#cbd6ed}.stage-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.stage{padding:18px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);min-width:0}.stage small{color:var(--accent);display:block;margin-bottom:20px}.stage b{display:block}.stage p{font-size:12px;color:var(--muted);line-height:1.5}.form-stack{display:grid;gap:15px}.form-stack label{display:grid;gap:7px;font-size:12px;color:var(--muted)}.form-stack input,.form-stack select{width:100%;padding:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px}.form-stack .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:13px}.endpoint{padding:14px 0;border-bottom:1px solid var(--line)}.endpoint summary{cursor:pointer;display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-size:13px}.endpoint summary>span{margin-left:auto;color:var(--muted)}.endpoint p{font-size:13px;color:var(--muted)}.endpoint pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1020;padding:16px;border-radius:9px}.verb{font-weight:800;color:#8ad9ae}.verb.post{color:#f0c478}@media(max-width:950px){.stage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.hero-panel{padding:24px 20px}.stage-grid{grid-template-columns:1fr}.form-stack .two{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">P</div><div><strong>PERAGUS</strong><small>FINANCIAL INFRASTRUCTURE</small></div></div><div><div class="nav-label">Workspace</div><nav class="nav" id="nav"></nav></div><div class="side-bottom"><b>● Piloto controlado</b><p>Interface de demonstração. Sem conexão com dados financeiros ou APIs reais.</p><div class="mini">◈ Solana · USDT</div></div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="menu" aria-label="Abrir menu">☰</button><div class="breadcrumb">Peragus / <b id="crumb">Visão geral</b></div></div><div class="top-right"><span class="pill">◉ Ambiente de protótipo</span><button class="theme" id="theme" aria-label="Alternar tema">☾ Modo escuro</button><div class="avatar">PG</div></div></header><div class="content" id="content"></div></main></div><script>
const data=[{id:'PG-1042',client:'Cliente 01',amount:450,usdt:'82,14',status:'Aguardando aprovação',tone:'amber',time:'Hoje, 14:32',wallet:'7h4M…q9Xa'},{id:'PG-1041',client:'Cliente 02',amount:300,usdt:'54,76',status:'Entregue',tone:'green',time:'Hoje, 11:08',wallet:'4g8K…s2Xf'},{id:'PG-1040',client:'Cliente 03',amount:500,usdt:'91,27',status:'Em reconciliação',tone:'amber',time:'Ontem, 17:41',wallet:'8a6T…j4Lq'},{id:'PG-1039',client:'Cliente 04',amount:200,usdt:'36,51',status:'Em análise',tone:'red',time:'Ontem, 10:15',wallet:'3d9P…f6Qr'},{id:'PG-1038',client:'Cliente 05',amount:150,usdt:'27,38',status:'Entregue',tone:'green',time:'19 out, 15:23',wallet:'9x2N…p7Aa'}];
let page='home',theme='dark',filter='Todas',query='',selected='PG-1042';const icons={home:'◇',dashboard:'▦',operations:'⇄',purchase:'＋',wallet:'◎',liquidity:'◈',integrations:'⌘',architecture:'⬡',settlement:'⟲',developers:'{ }',audit:'▤',incidents:'!',account:'♙'};const titles={home:'Institucional',dashboard:'Visão geral',operations:'Operações',purchase:'Comprar USDT',wallet:'Carteira e identidade',liquidity:'Liquidez',integrations:'Integrações',architecture:'Arquitetura',settlement:'Settlement Lab',developers:'API / Developers',audit:'Auditoria',incidents:'Incidentes',account:'Minha conta'};const money=n=>'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2});const badge=(t,c='')=>`<span class="status ${c}"><i class="dot"></i>${t}</span>`;const card=(label,value,detail)=>`<div class="card metric"><div class="metric-label">${label}<span>↗</span></div><strong>${value}</strong><small>${detail}</small></div>`;const heading=(eyebrow,title,subtitle,actions='')=>`<div class="head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${actions}</div></div>`;const demo=`<div class="demo"><b>Protótipo visual · dados ilustrativos.</b> Valores, clientes, saldos, conectividade e operações abaixo são exemplos fictícios. Nenhuma ação movimenta fundos.</div>`;function rows(items){return `<div class="table-scroll"><table><thead><tr><th>Operação</th><th>Cliente</th><th>Valor BRL</th><th>USDT estimado</th><th>Status</th><th>Data</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.client}</td><td>${money(x.amount)}</td><td>${x.usdt} USDT</td><td>${badge(x.status,x.tone)}</td><td class="muted">${x.time}</td><td><button class="btn" onclick="showDetail('${x.id}')">Detalhes →</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma operação corresponde aos filtros.</td></tr>'}</tbody></table></div>`}
function dashboard(){return heading('Operations overview','Visão geral','Acompanhe o piloto, suas operações e os pontos que precisam de atenção.',`<button class="btn" onclick="navigate('operations')">Ver operações →</button>`)+demo+`<div class="metrics">${card('Volume ilustrativo',money(1600),'5 operações no exemplo')}${card('Operações ilustrativas','05','2 entregues · 3 em andamento')}${card('Aguardando aprovação','01','Ação manual necessária')}${card('Pendências operacionais','02','Revisão e reconciliação')}</div><div class="two"><section class="card"><div class="panel-head"><div><h2>Volume de operações</h2><p class="subtitle">Distribuição ilustrativa nos últimos sete dias</p></div><span class="pill">BRL</span></div><div class="panel-body"><div class="bar-chart">${[28,48,36,72,43,95,64].map((h,i)=>`<div class="barcol"><div class="bar ${i===5?'darkbar':''}" style="height:${h}%"></div><span>${['Qua','Qui','Sex','Sáb','Dom','Seg','Ter'][i]}</span></div>`).join('')}</div></div></section><section class="card"><div class="panel-head"><h2>Fila de atenção</h2>${badge('2 pendências','amber')}</div><div class="panel-body row-list"><div class="item"><div class="circle">✓</div><div class="item-main"><b>Aprovação de retirada</b><p>PG-1042 · R$ 450,00</p></div><button class="btn" onclick="showDetail('PG-1042')">Abrir</button></div><div class="item"><div class="circle">!</div><div class="item-main"><b>Revisão de operação</b><p>PG-1039 · Necessita análise</p></div><button class="btn" onclick="showDetail('PG-1039')">Abrir</button></div><div class="item"><div class="circle">↻</div><div class="item-main"><b>Reconciliação pendente</b><p>PG-1040 · Verificar evidências</p></div><button class="btn" onclick="showDetail('PG-1040')">Abrir</button></div></div></section></div><section class="card"><div class="panel-head"><h2>Operações recentes</h2><button class="btn" onclick="navigate('operations')">Ver todas →</button></div>${rows(data.slice(0,4))}</section>`}
function operations(){let list=data.filter(x=>(filter==='Todas'||x.status===filter)&&(`${x.id} ${x.client}`.toLowerCase().includes(query.toLowerCase())));return heading('Payment operations','Operações','Visualize o ciclo de compra BRL → USDT, da cotação à entrega e reconciliação.',`<button class="btn primary" onclick="notify('O fluxo de nova compra depende da API do piloto e permanece desativado neste protótipo.')">+ Nova operação (conceito)</button>`)+demo+`<div class="tabs">${['Todas','Aguardando aprovação','Entregue','Em reconciliação','Em análise'].map(x=>`<button class="${filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><section class="card"><div class="filter"><input class="search" id="search" placeholder="Buscar por operação ou cliente..." value="${query.replace(/"/g,'&quot;')}" oninput="setQuery(this.value)" aria-label="Buscar operações"><span class="small muted">${list.length} resultados</span></div>${rows(list)}</section><p class="footer-note">Os estados reais devem vir da API. A interface não aprova retiradas nem altera status localmente. Aprovações futuras exigirão autorização, confirmação e auditoria no servidor.</p>`}
function detail(){let x=data.find(z=>z.id===selected)||data[0];return heading('Payment operations / '+x.id,'Detalhes da operação',`Acompanhe os eventos e evidências da operação ${x.id}.`,`<button class="btn" onclick="navigate('operations')">← Voltar</button>`)+demo+`<div class="metrics">${card('Valor pago',money(x.amount),'BRL · Pix')}${card('USDT estimado',x.usdt+' USDT','Exemplo, não é cotação')}${card('Carteira de destino',x.wallet,'Solana · endereço ilustrativo')}${card('Estado atual',x.status,'Informação simulada')}</div><div class="two"><section class="card"><div class="panel-head"><h2>Linha do tempo</h2>${badge(x.status,x.tone)}</div><div class="panel-body steps">${[['01','Cotação criada','Condições apresentadas ao cliente'],['02','Cotação aceita','Aceite explícito das condições'],['03','Pagamento Pix','Aguardando ou confirmando recebimento'],['04','Aprovação manual','Operador valida a retirada'],['05','Entrega Solana','Confirmação on-chain'],['06','Reconciliação','Conciliação de evidências']].map(z=>`<div class="step"><div class="step-dot">${z[0]}</div><div><b>${z[1]}</b><p>${z[2]}</p></div></div>`).join('')}</div></section><section class="card"><div class="panel-head"><h2>Resumo e controles</h2></div><div class="panel-body"><div class="kv"><span>Identificador</span><b>${x.id}</b></div><div class="kv"><span>Rede</span><b>Solana Mainnet</b></div><div class="kv"><span>Ativo</span><b>USDT</b></div><div class="kv"><span>Cliente</span><b>${x.client}</b></div><div class="kv"><span>Comprovação</span><b>Exemplo não verificado</b></div><div style="margin-top:24px"><button class="btn primary" disabled style="width:100%">Aprovar retirada — indisponível</button><p class="footer-note">Ação desativada neste protótipo. A versão integrada exigirá autorização do operador e confirmação no servidor.</p></div></div></section></div>`}
function liquidity(){return heading('Treasury visibility','Liquidez','Acompanhe indicadores de disponibilidade e conciliação sem custodiar fundos de clientes.',`<button class="btn" onclick="notify('Exportação depende de dados reais e não está implementada neste protótipo.')">Exportar relatório</button>`)+demo+`<div class="metrics">${card('Disponibilidade do provedor','Não conectado','Sem leitura de saldo real')}${card('Reserva operacional','R$ 500,00','Meta prevista no escopo; não verificada')}${card('Em reconciliação','01 exemplo','Não representa saldo custodiado')}${card('Exposição de clientes','Não aplicável','Sem saldos internos no MVP')}</div><div class="two"><section class="card"><div class="panel-head"><h2>Visibilidade dos fluxos</h2><span class="pill">Somente leitura</span></div><div class="panel-body"><div class="item"><div class="circle">R$</div><div class="item-main"><b>Entrada em BRL</b><p>Pix confirmado pelo parceiro</p></div>${badge('Origem externa')}</div><div class="item"><div class="circle">⇄</div><div class="item-main"><b>Conversão BRL → USDT</b><p>Execução financeira pelo parceiro</p></div>${badge('Parceiro')}</div><div class="item"><div class="circle">◎</div><div class="item-main"><b>Entrega na Solana</b><p>Destino: carteira verificada do cliente</p></div>${badge('Mainnet')}</div><div class="item"><div class="circle">✓</div><div class="item-main"><b>Reconciliação</b><p>Comparação de evidências e estados</p></div>${badge('Operacional')}</div></div></section><section class="card"><div class="panel-head"><h2>Princípios de exposição</h2></div><div class="panel-body"><div class="kv"><span>Custódia Peragus</span><b>Não prevista</b></div><div class="kv"><span>Limite por compra</span><b>R$ 500</b></div><div class="kv"><span>Compras simultâneas</span><b>1</b></div><div class="kv"><span>Aprovação</span><b>Manual</b></div><div class="kv"><span>Outros ativos</span><b>Fora do piloto</b></div><p class="footer-note">Os limites são requisitos do escopo, não controles implementados nesta página. Sua aplicação efetiva pertence ao servidor.</p></div></section></div><section class="card"><div class="panel-head"><h2>Reconciliações</h2><span class="small muted">Exemplos visuais</span></div>${rows(data.filter(x=>x.status==='Em reconciliação'))}</section>`}

function navigate(p){page=p;filter='Todas';query='';render();window.scrollTo({top:0,behavior:'smooth'});document.getElementById('sidebar').classList.remove('open')}function showDetail(id){selected=id;page='detail';render();window.scrollTo({top:0,behavior:'smooth'})}function setFilter(v){filter=v;render()}function setQuery(v){query=v;let a=document.activeElement;let pos=a.selectionStart;render();let b=document.getElementById('search');b?.focus();b?.setSelectionRange(pos,pos)}function notify(msg){let old=document.querySelector('.toast');old?.remove();let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3500)}function render(){document.body.classList.toggle('dark',theme==='dark');document.getElementById('theme').textContent='☾ Dark mode';document.getElementById('crumb').textContent=titles[page]||'Detalhes da operação';document.getElementById('nav').innerHTML=['home','dashboard','operations','purchase','wallet','audit','account'].map(p=>`<button class="${page===p||(page==='detail'&&p==='operations')?'active':''}" onclick="navigate('${p}')"><span class="symbol">${icons[p]}</span>${titles[p]}</button>`).join('');document.getElementById('content').innerHTML=({home,dashboard,operations,purchase,wallet,liquidity,integrations,architecture,settlement,developers,audit,incidents,account,detail}[page])()}document.getElementById('theme').onclick=()=>notify('Este conceito usa apenas modo escuro.');document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');render();
</script></body></html>
